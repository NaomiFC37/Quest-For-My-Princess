
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Quest For My Princess</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #17152d;
  font-family: Georgia, serif;
}

#gameScreen {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: #17152d;
}

canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
}

#title {
  position: absolute;
  top: max(8px, env(safe-area-inset-top));
  left: 50%;
  transform: translateX(-50%);
  margin: 0;
  padding: 6px 16px;
  background: rgba(25, 20, 45, .78);
  color: #ffe1f3;
  border: 2px solid #e8b6dc;
  border-radius: 10px;
  font-size: clamp(12px, 2.8vw, 20px);
  white-space: nowrap;
  pointer-events: none;
}

#dpad {
  position: absolute;
  left: max(14px, env(safe-area-inset-left));
  bottom: max(14px, env(safe-area-inset-bottom));
  display: grid;
  grid-template-columns: repeat(3, 52px);
  grid-template-rows: repeat(3, 45px);
  gap: 3px;
}

.control {
  background: rgba(34, 28, 55, .78);
  border: 2px solid rgba(255, 230, 245, .8);
  border-radius: 10px;
  color: white;
  font-size: 23px;
  font-weight: bold;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  cursor: pointer;
}

.control:active {
  background: #a569a6;
}

#up    { grid-column: 2; grid-row: 1; }
#left  { grid-column: 1; grid-row: 2; }
#down  { grid-column: 2; grid-row: 2; }
#right { grid-column: 3; grid-row: 2; }

#talk {
  position: absolute;
  right: max(22px, env(safe-area-inset-right));
  bottom: max(40px, env(safe-area-inset-bottom));
  width: 76px;
  height: 76px;
  border-radius: 50%;
  font-size: 16px;
  background: rgba(88, 43, 103, .88);
  border-color: #f7c7e5;
}

#message {
  position: absolute;
  left: 50%;
  bottom: 12px;
  transform: translateX(-50%);
  background: rgba(25, 20, 45, .85);
  color: #ffe1f3;
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 13px;
  pointer-events: none;
  text-align: center;
  max-width: 65%;
}

#rotateScreen {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 10;
  background: #17152d;
  color: #ffe1f3;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  text-align: center;
  padding: 25px;
}

#rotateScreen .phone { font-size: 60px; }
#rotateScreen h2 { font-size: 24px; }

@media (orientation: portrait) and (pointer: coarse) {
  #rotateScreen { display: flex; }
}

@media (max-height: 360px) {
  #dpad {
    transform: scale(.75);
    transform-origin: bottom left;
  }
  #talk {
    transform: scale(.8);
    transform-origin: bottom right;
  }
  #message { display: none; }
}
</style>
</head>

<body>
<div id="gameScreen">
  <canvas id="game"></canvas>

  <h1 id="title">👑 Quest For My Princess 👑</h1>

  <div id="dpad">
    <button class="control" id="up" data-dir="up">▲</button>
    <button class="control" id="left" data-dir="left">◀</button>
    <button class="control" id="down" data-dir="down">▼</button>
    <button class="control" id="right" data-dir="right">▶</button>
  </div>

  <button class="control" id="talk">TALK</button>

  <div id="message">Find your princess. Save your love. ♡</div>
</div>

<div id="rotateScreen">
  <div class="phone">📱 ↻</div>
  <h2>Rotate your phone, Princess!</h2>
  <p>Your adventure awaits in landscape mode. 👑</p>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// Our world stays the same size internally.
const WORLD_W = 640;
const WORLD_H = 400;

canvas.width = WORLD_W;
canvas.height = WORLD_H;

// Preserve the world's proportions on any screen.
function resizeGame() {
  const screen = document.getElementById("gameScreen");
  const ratio = WORLD_W / WORLD_H;
  const screenRatio = screen.clientWidth / screen.clientHeight;

  if (screenRatio > ratio) {
    canvas.style.width = "auto";
    canvas.style.height = "100%";
    canvas.style.left = "50%";
    canvas.style.top = "0";
    canvas.style.transform = "translateX(-50%)";
  } else {
    canvas.style.width = "100%";
    canvas.style.height = "auto";
    canvas.style.left = "0";
    canvas.style.top = "50%";
    canvas.style.transform = "translateY(-50%)";
  }
}

window.addEventListener("resize", resizeGame);
resizeGame();

const princess = {
  x: 300,
  y: 180,
  speed: 3
};

const keys = new Set();

// Keyboard controls
window.addEventListener("keydown", e => {
  const key = e.key.toLowerCase();
  const allowed = [
    "arrowup", "arrowdown", "arrowleft",
    "arrowright", "w", "a", "s", "d"
  ];

  if (allowed.includes(key)) {
    e.preventDefault();
    keys.add(key);
  }

  if (key === "e" || key === " ") {
    e.preventDefault();
    interact();
  }
});

window.addEventListener("keyup", e => {
  keys.delete(e.key.toLowerCase());
});

window.addEventListener("blur", () => keys.clear());

// Touch controls
document.querySelectorAll("[data-dir]").forEach(button => {
  const direction = button.dataset.dir;

  button.addEventListener("pointerdown", e => {
    e.preventDefault();
    button.setPointerCapture(e.pointerId);
    keys.add(direction);
  });

  const release = () => keys.delete(direction);

  button.addEventListener("pointerup", release);
  button.addEventListener("pointercancel", release);
  button.addEventListener("lostpointercapture", release);
});

// Interaction button
document.getElementById("talk")
  .addEventListener("click", interact);

function interact() {
  const message = document.getElementById("message");
  message.textContent = "Your adventure is just beginning! ♡";
}

// Draw the kingdom
function drawWorld() {
  ctx.fillStyle = "#79bb69";
  ctx.fillRect(0, 0, WORLD_W, WORLD_H);

  // Dirt pathway
  ctx.fillStyle = "#d9bb83";
  ctx.fillRect(0, 175, WORLD_W, 55);

  // Flowers
  for (let i = 0; i < 24; i++) {
    const x = (i * 83 + 35) % 620;
    const y = (i * 59 + 30) % 380;

    if (y > 165 && y < 240) continue;

    ctx.fillStyle = "#f7c2e2";
    ctx.fillRect(x, y, 7, 7);
    ctx.fillStyle = "#fff1a5";
    ctx.fillRect(x + 2, y + 2, 3, 3);
  }

  // Trees
  const trees = [
    [45,45], [105,60], [550,45],
    [585,105], [65,305], [550,320]
  ];

  trees.forEach(([x,y]) => {
    ctx.fillStyle = "#78513b";
    ctx.fillRect(x + 13, y + 22, 12, 22);
    ctx.fillStyle = "#286b45";
    ctx.fillRect(x, y, 40, 32);
    ctx.fillStyle = "#40935c";
    ctx.fillRect(x + 7, y - 8, 26, 28);
  });
}

// Draw Princess Valeriia
function drawPrincess() {
  const x = Math.round(princess.x);
  const y = Math.round(princess.y);

  // Shadow
  ctx.fillStyle = "#4b8655";
  ctx.fillRect(x + 3, y + 28, 24, 5);

  // Blue royal dress
  ctx.fillStyle = "#5674d8";
  ctx.fillRect(x + 5, y + 16, 20, 13);
  ctx.fillRect(x + 1, y + 24, 28, 7);

  // Face
  ctx.fillStyle = "#f4c5a5";
  ctx.fillRect(x + 7, y + 5, 16, 14);

  // Blonde hair
  ctx.fillStyle = "#f5d46c";
  ctx.fillRect(x + 5, y + 2, 20, 6);
  ctx.fillRect(x + 3, y + 6, 5, 15);
  ctx.fillRect(x + 22, y + 6, 5, 15);

  // Eyes
  ctx.fillStyle = "#30283f";
  ctx.fillRect(x + 10, y + 12, 3, 3);
  ctx.fillRect(x + 18, y + 12, 3, 3);

  // Crown
  ctx.fillStyle = "#ffdf65";
  ctx.fillRect(x + 8, y - 4, 14, 6);
  ctx.fillRect(x + 8, y - 8, 4, 5);
  ctx.fillRect(x + 18, y - 8, 4, 5);
  ctx.fillRect(x + 14, y - 10, 3, 7);
}

// Game loop
let previousTime = 0;

function gameLoop(time) {
  const delta = previousTime
    ? Math.min((time - previousTime) / 16.67, 2)
    : 1;
  previousTime = time;

  let dx = 0;
  let dy = 0;

  if (keys.has("arrowleft") || keys.has("a") || keys.has("left")) dx--;
  if (keys.has("arrowright") || keys.has("d") || keys.has("right")) dx++;
  if (keys.has("arrowup") || keys.has("w") || keys.has("up")) dy--;
  if (keys.has("arrowdown") || keys.has("s") || keys.has("down")) dy++;

  const length = Math.hypot(dx, dy) || 1;

  princess.x += (dx / length) * princess.speed * delta;
  princess.y += (dy / length) * princess.speed * delta;

  // Map boundaries
  princess.x = Math.max(5, Math.min(605, princess.x));
  princess.y = Math.max(12, Math.min(365, princess.y));

  drawWorld();
  drawPrincess();

  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
